name: Build and Deploy Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/dama-websitecompro-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=main-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            DEPLOY_PATH="${DEPLOY_PATH:-/home/rano/dama-studio/dama-websitecompro-frontend}"

            mkdir -p "${DEPLOY_PATH}"

            echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.repository_owner }} --password-stdin

            IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
            IMAGE_TAG="latest"

            echo "Pulling image: ${IMAGE_NAME}:${IMAGE_TAG}"
            PULL_OK=0
            for i in 1 2 3; do
              echo "Pull attempt ${i}/3..."
              if docker pull "${IMAGE_NAME}:${IMAGE_TAG}"; then
                PULL_OK=1
                break
              fi
              echo "Pull failed, retrying in 15s..."
              sleep 15
            done
            if [ "$PULL_OK" -ne 1 ]; then
              echo "Failed to pull ${IMAGE_NAME}:${IMAGE_TAG}"
              exit 1
            fi

            docker stop dama-websitecompro-frontend || true
            docker rm dama-websitecompro-frontend || true

            docker run -d \
              --name dama-websitecompro-frontend \
              --restart unless-stopped \
              --add-host=host.docker.internal:host-gateway \
              -p 3160:80 \
              "${IMAGE_NAME}:${IMAGE_TAG}"

            docker image prune -f || true
            docker ps -a | grep dama-websitecompro-frontend || echo "Container status check"
